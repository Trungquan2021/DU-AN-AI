    <script>
      (function () {
        // Suppress any external or iframe inspector error about assigning fetch to Window
        window.addEventListener(
          'error',
          function (e) {
            if (
              e &&
              e.message &&
              e.message.indexOf('fetch') !== -1 &&
              (e.message.indexOf('getter') !== -1 || e.message.indexOf('read only') !== -1)
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );

        // Ensure window.fetch is safely writable
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            try {
              Object.defineProperty(window, 'fetch', {
                value: originalFetch,
                writable: true,
                configurable: true,
                enumerable: true,
              });
            } catch (err1) {
              try {
                var currentFetch = originalFetch;
                Object.defineProperty(window, 'fetch', {
                  get: function () {
                    return currentFetch;
                  },
                  set: function (fn) {
                    currentFetch = fn;
                  },
                  configurable: true,
                  enumerable: true,
                });
              } catch (err2) {}
            }
          }
        } catch (err) {}
      })();
    </script>
