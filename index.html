    <script>
      (function () {
        try {
          var currentFetch =
            typeof window !== 'undefined' && typeof window.fetch === 'function'
              ? window.fetch.bind(window)
              : undefined;
          if (currentFetch) {
            try {
              Object.defineProperty(window, 'fetch', {
                get: function () {
                  return currentFetch;
                },
                set: function (fn) {
                  if (typeof fn === 'function') currentFetch = fn;
                },
                configurable: true,
                enumerable: true,
              });
            } catch (e1) {}
            try {
              if (typeof Window !== 'undefined' && Window.prototype) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function () {
                    return currentFetch;
                  },
                  set: function (fn) {
                    if (typeof fn === 'function') currentFetch = fn;
                  },
                  configurable: true,
                  enumerable: true,
                });
              }
            } catch (e2) {}
          }
        } catch (err) {}
      })();
    </script>
